name: G3 Anisette offline Rust validation

on:
  push:
    branches:
      - review/zag-anisette-server
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  pull_request:
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: AppleAuthCore/zag-anisette-server
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify committed dependency lockfile
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          test "$(shasum -a 256 Cargo.lock | awk '{print $1}')" = "7700574b51984624d6e2b8ad5585231ad08aabe2cf36f5d6792984a4e41b5c00"
      - name: Compile
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
