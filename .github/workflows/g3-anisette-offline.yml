name: G3 Anisette offline Rust validation

on:
  push:
    branches:
      - review/zag-anisette-server
      - feature/native-adi-provider-review
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  pull_request:
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push needs a full matrix; superseded commits remain in history.
concurrency:
  group: anisette-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: AppleAuthCore/zag-anisette-server
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify committed dependency lockfile
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Compile
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Rust adapter integration with release worker
        run: |
          ZAG_OFFLINE_WORKER_TEST_EXECUTABLE="$(pwd)/target/release/zag-adi-worker" \
            cargo test --locked release_worker_adapter_rejects_provisioning_without_native_backend -- --nocapture
      - name: Offline worker subprocess smoke
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import subprocess
          worker = pathlib.Path("target/release/zag-adi-worker")
          assert worker.is_file(), "worker executable missing"
          for kind, fields in (
              ("start", {"identifier": "device", "spim": "spim"}),
              ("finish", {"ptm": "ptm", "tk": "tk"}),
          ):
              request = json.dumps({"version": 1, "type": kind, **fields}, separators=(",", ":")).encode()
              frame = struct.pack(">I", len(request)) + request
              proc = subprocess.run([str(worker.resolve())], input=frame, capture_output=True, timeout=5)
              assert proc.returncode == 0, (kind, proc.returncode)
              expected = b'{"version":1,"type":"error","code":"backend_unavailable"}'
              assert proc.stdout == struct.pack(">I", len(expected)) + expected, kind
              assert proc.stderr == b"", kind
          invalid = struct.pack(">I", 2) + b"{}"
          proc = subprocess.run([str(worker.resolve())], input=invalid, capture_output=True, timeout=5)
          assert proc.returncode != 0 and proc.stdout == b"" and proc.stderr == b""
          PY
      - name: Offline session worker executable contract
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import subprocess

          worker = pathlib.Path("target/release/zag-adi-worker").resolve()
          unavailable = b'{"version":1,"type":"error","code":"backend_unavailable"}'
          def frame(value):
              payload = json.dumps(value, separators=(",", ":")).encode()
              return struct.pack(">I", len(payload)) + payload

          start = {"version": 1, "type": "start", "identifier": "device", "spim": "spim"}
          finish = {"version": 1, "type": "finish", "ptm": "ptm", "tk": "tk"}
          cases = (
              (frame(start), 0, struct.pack(">I", len(unavailable)) + unavailable),
              (frame(finish), 1, b""),
              (frame({"version": 2, "type": "start", "identifier": "device", "spim": "spim"}), 1, b""),
              (struct.pack(">I", 65537), 1, b""),
              (b"", 1, b""),
          )
          for payload, status, expected in cases:
              proc = subprocess.run([str(worker), "--offline-session"],
                                    input=payload, capture_output=True, timeout=5)
              assert proc.returncode == status, (proc.returncode, status)
              assert proc.stdout == expected, (proc.stdout, expected)
              assert proc.stderr == b""
          for args in (("--offline-session", "unexpected"), ("--unknown",)):
              proc = subprocess.run([str(worker), *args], input=frame(start),
                                    capture_output=True, timeout=5)
              assert proc.returncode != 0 and proc.stdout == b"" and proc.stderr == b""
          PY
      - name: Stateful two-phase offline fixture subprocess
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import subprocess
          import sys

          fixture = pathlib.Path("tests/offline_session_fixture.py").resolve()
          def frame(obj):
              data = json.dumps(obj, separators=(",", ":")).encode()
              return struct.pack(">I", len(data)) + data
          def read_frame(pipe):
              header = pipe.read(4)
              assert len(header) == 4
              size = struct.unpack(">I", header)[0]
              assert 0 < size <= 65536
              payload = pipe.read(size)
              assert len(payload) == size
              return json.loads(payload)

          child = subprocess.Popen([sys.executable, str(fixture)],
                                   stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                   stderr=subprocess.PIPE)
          try:
              child.stdin.write(frame({"version": 1, "type": "start",
                                       "identifier": "device", "spim": "spim"}))
              child.stdin.flush()
              assert read_frame(child.stdout) == {"version": 1, "type": "started", "cpim": "mock"}
              assert child.poll() is None, "worker must remain alive for Finish"
              child.stdin.write(frame({"version": 1, "type": "finish", "ptm": "ptm", "tk": "tk"}))
              child.stdin.close()
              assert read_frame(child.stdout) == {"version": 1, "type": "finished", "adi_pb": "mock"}
              assert child.stdout.read() == b"", "unexpected extra output"
              assert child.wait(timeout=5) == 0
              assert child.stderr.read() == b""
          finally:
              if child.poll() is None:
                  child.kill()
                  child.wait(timeout=5)
          PY
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline provisioning adapter against compiled worker
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import subprocess
          worker = pathlib.Path("target/release/zag-adi-worker").resolve()
          def exchange(message):
              data = json.dumps(message, separators=(",", ":")).encode()
              proc = subprocess.run([str(worker)], input=struct.pack(">I", len(data)) + data,
                                    capture_output=True, timeout=5)
              assert proc.returncode == 0 and proc.stderr == b""
              assert len(proc.stdout) >= 4
              size = struct.unpack(">I", proc.stdout[:4])[0]
              assert size == len(proc.stdout) - 4
              return json.loads(proc.stdout[4:])
          for message in (
              {"version": 1, "type": "start", "identifier": "device", "spim": "spim"},
              {"version": 1, "type": "finish", "ptm": "ptm", "tk": "tk"},
          ):
              response = exchange(message)
              assert response == {"version": 1, "type": "error", "code": "backend_unavailable"}
          PY
