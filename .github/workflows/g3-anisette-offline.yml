name: G3 Anisette offline Rust validation

on:
  push:
    branches:
      - review/zag-anisette-server
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  pull_request:
    paths:
      - 'AppleAuthCore/zag-anisette-server/**'
      - '.github/workflows/g3-anisette-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: AppleAuthCore/zag-anisette-server
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Resolve dependency lockfile for validation
        run: cargo generate-lockfile
      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: zag-anisette-cargo-lock
          path: AppleAuthCore/zag-anisette-server/Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Compile
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
