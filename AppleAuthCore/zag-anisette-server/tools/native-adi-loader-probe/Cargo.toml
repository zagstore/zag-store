[package]
name = "zag-native-adi-loader-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
android-loader = { git = "https://github.com/Dadoum/android-loader", rev = "dfa86501afca7caa23d5ce15322ac7260d857485" }
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
plist = "=1.7.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# Same rustls build ureq uses (no new crates); needed to name TLS failures.
rustls = { version = "0.23.19", default-features = false, features = ["ring", "logging", "std", "tls12"] }
url = "=2.5.4"
sha2 = "0.10"
