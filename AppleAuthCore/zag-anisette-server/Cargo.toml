[package]
name = "zag-anisette-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "zag-anisette-server"
path = "main.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[dependencies]
serde_json = "1.0"

# Test-only: the WebSocket client library (and version) the fork's v3 client
# uses, to check the upgrade is refused as that client sees it.
[dev-dependencies]
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
