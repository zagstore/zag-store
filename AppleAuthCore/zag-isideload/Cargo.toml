# Zag Store fork of nab138/isideload, pinned to upstream commit
# 326e56229d0790d5d3ac9ec0f8cb1d47f8bc1bc5 (crate 0.5.2). Only sign-in,
# developer portal and anisette are kept; see PROVENANCE.md for every change.
[package]
name = "zag-isideload"
description = "Zag Store's trimmed fork of isideload: Apple Account sign-in, developer portal and anisette only"
license = "MIT AND MPL-2.0"
version = "0.5.2+zag.1"
edition = "2024"
publish = false

[lib]
name = "isideload"

[features]
# Nothing reaches the network unless this is enabled. Off by default and not
# enabled by Zag Store without the owner's separate approval.
default = []
live-network = []

[dependencies]
plist = "1.8"
plist-macro = "0.1.4"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "gzip", "rustls-no-provider", "http2", "charset"] }
thiserror = "2.0.17"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.8.5"
uuid = { version = "1.20.0", features = ["v4"] }
tokio = { version = "1.49", features = ["time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rootcause = "0.12.0"
futures-util = "0.3.31"
serde_json = "1.0.149"
base64 = "0.22.1"
hex = "0.4.3"
sha2 = "0.11.0"
srp = "=0.7.0-rc.3"
pbkdf2 = "0.13.0"
hmac = "0.13.0"
cbc = { version = "0.2.0", features = ["alloc"] }
aes = "0.9.0"
aes-gcm = "0.11.1"
reqwest-middleware = "0.5.1"
http = "1.4.0"
urlencoding = { version = "2.1.3" }
futures = "0.3.32"
web-time = "1"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
